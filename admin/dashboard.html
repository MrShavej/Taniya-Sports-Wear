<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Taniya Sports Wear</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .dashboard {
            padding: 60px 7%;
            min-height: 80vh;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .dashboard-header p {
            color: #777;
            margin-top: 5px;
        }

        .logout-btn {
            background: #1c1c1c;
            color: white;
            border: 1px solid #333;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .product-form {
            max-width: 700px;
            background: #121212;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 30px;
        }

        .product-form h2 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: #1c1c1c;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .add-product-btn {
            width: 100%;
            padding: 13px;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .add-product-btn:hover {
            background: #ddd;
        }

        #product-message {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }


        /* ================================
           MANAGE PRODUCTS
        ================================= */

        .admin-products {
            margin-top: 50px;
            max-width: 1000px;
        }

        .admin-products h2 {
            margin-bottom: 25px;
        }

        #admin-product-list {
            display: grid;
            gap: 15px;
        }

        .admin-product-card {
            background: #121212;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .admin-product-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .admin-product-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background: #1c1c1c;
            border: 1px solid #333;
        }

        .admin-product-details h3 {
            margin-bottom: 6px;
        }

        .admin-product-details p {
            color: #999;
            font-size: 14px;
            margin: 4px 0;
        }

        .admin-product-actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn,
        .delete-btn {
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #333;
        }

        .edit-btn {
            background: white;
            color: black;
        }

        .delete-btn {
            background: #1c1c1c;
            color: white;
        }

        .edit-btn:hover {
            background: #ddd;
        }

        .delete-btn:hover {
            background: #333;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 700px) {

            .dashboard {
                padding: 40px 5%;
            }

            .dashboard-header {
                align-items: flex-start;
                gap: 20px;
            }

            .admin-product-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-product-info {
                width: 100%;
            }

            .admin-product-actions {
                width: 100%;
            }

            .edit-btn,
            .delete-btn {
                flex: 1;
            }

        }
    </style>
</head>


<body>


<header class="navbar">

    <div class="logo">
        <span>T</span>Taniya Sports Wear
    </div>

    <a href="../products.html" class="admin-btn">
        View Products
    </a>

</header>



<main class="dashboard">


    <!-- ================================
         DASHBOARD HEADER
    ================================= -->

    <div class="dashboard-header">

        <div>

            <h1>Admin Dashboard</h1>

            <p>
                Manage Taniya Sports Wear products.
            </p>

        </div>


        <button
            id="logout-btn"
            class="logout-btn"
        >
            Logout
        </button>

    </div>



    <!-- ================================
         ADD PRODUCT
    ================================= -->

    <div class="product-form">

        <h2>Add New Product</h2>


        <form id="product-form">


            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="product-name"
                    placeholder="Example: Premium Sports T-Shirt"
                    required
                >

            </div>



            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    id="product-category"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="T-Shirt">
                        T-Shirt
                    </option>

                    <option value="Lower">
                        Lower
                    </option>

                    <option value="Shorts">
                        Shorts
                    </option>

                    <option value="Custom">
                        Custom
                    </option>

                </select>

            </div>



            <!-- PRICE -->

            <div class="form-group">

                <label>
                    Price (₹)
                </label>

                <input
                    type="number"
                    id="product-price"
                    placeholder="499"
                    min="0"
                    required
                >

            </div>



            <!-- SIZES -->

            <div class="form-group">

                <label>
                    Sizes
                </label>

                <input
                    type="text"
                    id="product-sizes"
                    placeholder="S, M, L, XL"
                >

            </div>



            <!-- STOCK -->

            <div class="form-group">

                <label>
                    Stock
                </label>

                <input
                    type="number"
                    id="product-stock"
                    placeholder="10"
                    min="0"
                    value="0"
                >

            </div>



            <!-- IMAGE -->

            <div class="form-group">

               <label>Product Image</label>

<input
    type="file"
    id="product-image"
    accept="image/*"
>

            </div>



            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="product-description"
                    placeholder="Write product description..."
                ></textarea>

            </div>



            <!-- SUBMIT -->

            <button
                type="submit"
                class="add-product-btn"
            >
                Add Product
            </button>


        </form>


        <div id="product-message"></div>

    </div>



    <!-- ================================
         MANAGE PRODUCTS
    ================================= -->

    <div class="admin-products">

        <h2>
            Manage Products
        </h2>


        <div id="admin-product-list">

            Loading products...

        </div>

    </div>


</main>



<!-- ================================
     FOOTER
================================= -->

<footer>

    <div class="footer-logo">
        Taniya Sports Wear
    </div>

    <p>
        Custom Clothing • Quality Stitching • Your Style
    </p>

    <p class="copyright">
        © 2026 Taniya Sports Wear
    </p>

</footer>



<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script src="../js/supabase.js"></script>

<script src="../js/admin.js"></script>


</body>

</html>
