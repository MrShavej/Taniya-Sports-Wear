<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Taniya Sports Wear</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span>T</span>
            Taniya Sports Wear
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Products</a>
            <a href="gallery.html">Gallery</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <a href="admin/login.html" class="admin-btn">
            Admin
        </a>

    </header>


    <main class="products-page">

        <section class="products-header">

            <p>OUR COLLECTION</p>

            <h1>
                Explore Our <span>Products</span>
            </h1>

            <p class="products-description">
                Browse our latest T-shirts, lowers, shorts
                and custom clothing.
            </p>

        </section>


        <div class="filters">

            <button class="filter-btn active" data-category="all">
                All
            </button>

            <button class="filter-btn" data-category="T-Shirt">
                T-Shirts
            </button>

            <button class="filter-btn" data-category="Lower">
                Lowers
            </button>

            <button class="filter-btn" data-category="Shorts">
                Shorts
            </button>

            <button class="filter-btn" data-category="Custom">
                Custom
            </button>

        </div>


        <section
            id="products-container"
            class="products-grid"
        >

            <p class="loading">
                Loading products...
            </p>

        </section>

    </main>


    <footer>

        <div class="footer-logo">
            Taniya Sports Wear
        </div>

        <p>
            Custom Clothing • Quality Stitching • Your Style
        </p>

        <p class="copyright">
            © 2026 Taniya Sports Wear
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/products.js"></script>

</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</html>
